name: 功能建议
description: 建议改进补丁生成工具或翻译流程。
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请确保建议范围只涉及本仓库可以合法包含的代码、文档、脚本、测试或翻译文本。
  - type: textarea
    id: problem
    attributes:
      label: 这个建议想解决什么问题？
      placeholder: "例如：当我的 Steam 库在某个位置时，脚本无法自动找到游戏目录..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的解决方案
      description: 请描述最小可用版本，不需要一次覆盖所有场景。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 补丁生成脚本
        - Steam 目录识别
        - 翻译文本
        - 翻译校验
        - 文档
        - 测试
        - 其他
    validations:
      required: true
  - type: textarea
    id: legal-boundary
    attributes:
      label: 仓库边界
      description: 请确认这个建议是否可以在不包含官方游戏资源、完整生成补丁包、破解文件或第三方闭源补丁的前提下实现。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他补充
