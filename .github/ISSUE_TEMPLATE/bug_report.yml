name: Bug 反馈
description: 反馈补丁生成、兼容性或翻译问题。
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢测试《Fallout Shelter》简体中文补丁工具。项目仍处于测试阶段，请尽量提供系统环境、游戏版本和完整脚本输出，方便定位问题。

        请不要上传官方游戏文件、生成后的完整补丁包、完整 `data.unity3d`、破解内容、账号凭据或本机私有配置。
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我拥有并安装了正版 PC 版《Fallout Shelter》。
          required: true
        - label: 我没有上传官方游戏资源或生成后的完整补丁包。
          required: true
        - label: 如果脚本失败，我没有把可能损坏的输出强制复制到游戏目录。
          required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
      placeholder: "例如：Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Fallout Shelter 版本或 Steam 构建
      placeholder: "例如：Steam PC 版；如果知道 build 或日期也请填写"
    validations:
      required: true
  - type: dropdown
    id: game-location
    attributes:
      label: 游戏目录识别方式
      options:
        - 脚本自动识别
        - 脚本提示后手动粘贴
        - 使用 -GameDir 手动指定
        - 没有找到
    validations:
      required: true
  - type: dropdown
    id: failure-area
    attributes:
      label: 问题位置
      options:
        - 脚本启动
        - Python 依赖安装
        - Steam 游戏目录识别
        - 补丁生成
        - 手动复制或覆盖步骤
        - 游戏内文本或翻译
        - 游戏更新兼容性
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行 ...
        2. 选择 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望表现
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际表现
    validations:
      required: true
  - type: textarea
    id: script-output
    attributes:
      label: 脚本输出或错误文本
      description: 请粘贴文本输出，并先删去本机隐私路径或敏感信息。不要附加官方游戏文件或生成后的完整补丁包。
      render: text
  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 如果是翻译问题，只需要引用受影响的短文本，并说明它出现在哪里。
